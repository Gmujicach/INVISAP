{% extends 'base_cpanel.html' %}
{% block title %}Modificar Usuario{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header bg-info">
        <h4 class="text-white mb-0">Actualizar Datos de Usuario</h4>
      </div>
      <div class="card-body mt-4">
        <form action="{{ url_for('user_bp.update_user') }}" method="POST">
          <input type="hidden" name="id_user" value="{{ usuario.id }}">
          <div class="row">
            <div class="col-md-12 mb-3">
              <label class="form-label">Nombre y Apellido</label>
              <input type="text" name="name_surname" class="form-control" value="{{ usuario.name_surname }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" name="email_user" class="form-control" value="{{ usuario.email_user }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Nueva Contraseña <small>(Opcional)</small></label>
              <div class="password-input-wrapper input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input id="pass_user_update" type="password" name="pass_user" class="form-control password-reveal-input" placeholder="Opcional: 8-12 caracteres, letras y al menos un carácter especial">
                <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                  <span class="password-eye" aria-hidden="true">
                    <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                      <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                      <g class="eye">
                        <circle cy="12" cx="12" r="4" fill="currentColor" />
                        <circle cy="11" cx="13" r="1" fill="#000" />
                      </g>
                    </svg>
                  </span>
                  <span class="sr-only visually-hidden">Mostrar contraseña</span>
                </button>
              </div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button type="submit" class="btn btn-info px-5">
              <i class="bi bi-arrow-repeat"></i> Actualizar Usuario
            </button>
            <a href="{{ url_for('user_bp.list_users') }}" class="btn btn-secondary">
              Volver
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
