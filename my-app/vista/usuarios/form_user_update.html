{% extends 'base_cpanel.html' %}
{% block title %}Modificar Usuario{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header bg-info">
        <h4 class="text-white mb-0">Actualizar Datos de Usuario</h4>
      </div>
      <div class="card-body mt-4">
        <form action="{{ url_for('user_bp.update_user') }}" method="POST" id="formUpdateUser">
          <input type="hidden" name="id_user" value="{{ usuario.id_usuarios }}">
          <div class="row">
            <div class="col-md-12 mb-3">
              <label for="nombre" class="form-label">Nombre y Apellido</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="cedula_usuario" class="form-label">Cédula</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" id="cedula_usuario" name="cedula_usuario" class="form-control" value="{{ usuario.cedula_usuario }}" required maxlength="10">
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="correo" class="form-label">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="correo" name="correo" class="form-control" value="{{ usuario.correo }}" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="rol" class="form-label">Rol</label>
              <select id="rol" name="rol" class="form-control" required {% if usuario.rol == 'Super Usuario' %}disabled{% endif %}>
                <option value="">Cargando...</option>
              </select>
              {% if usuario.rol == 'Super Usuario' %}
                <small class="text-muted">El Super Usuario no puede cambiar de rol.</small>
              {% endif %}
            </div>
            <div class="col-md-6 mb-3 molecule-password-field">
              <label for="pass_user" class="form-label">Nueva Contraseña <small class="text-muted">(Opcional)</small></label>
              <div class="input-group input-group-merge">
                <input type="password" id="pass_user" name="pass_user" class="form-control password-input custom-placeholder" placeholder="Opcional: 8-12 caracteres, letras y símbolo" minlength="8" maxlength="12">
                <button type="button" class="btn btn-outline-secondary password-toggle-btn" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye-slash toggle-icon fs-5"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button type="submit" class="btn btn-info px-5">
              <i class="bi bi-arrow-clockwise"></i> Modificar Usuario
            </button>
            <a href="{{ url_for('user_bp.list_users') }}" class="btn btn-secondary">
              Volver
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block customJS %}
<script src="{{ url_for('static', filename='js/tour/usuarios/tour.js') }}"></script>
<script src="{{ url_for('static', filename='js/validaciones_comunes.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('formUpdateUser');
    if (form) {
      ValidacionesComunes.initSelects(form);
      ValidacionesComunes.initBotonesSubmit(form, { textoGuardando: 'Actualizando...' });
    }

    const rolSelect = document.getElementById('rol');
    const rolActual = '{{ usuario.rol }}';
    if (rolSelect && !rolSelect.disabled) {
      fetch('/api/seguridad/roles/listar')
        .then(function(r) { return r.json(); })
        .then(function(roles) {
          rolSelect.innerHTML = '<option value=\"\">Seleccione un rol...</option>';
          (Array.isArray(roles) ? roles : (roles.roles || [])).forEach(function(r) {
            if ((r.nombre || '').trim().toLowerCase() === 'super usuario') return;
            var opt = document.createElement('option');
            opt.value = r.nombre;
            opt.textContent = r.nombre;
            if (rolActual && opt.value === rolActual) opt.selected = true;
            rolSelect.appendChild(opt);
          });
        })
        .catch(function() {
          rolSelect.innerHTML = '<option value=\"\">Error al cargar</option>';
        });
    }
  });
</script>
{% endblock %}
