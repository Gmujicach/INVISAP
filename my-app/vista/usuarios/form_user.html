{% extends 'base_cpanel.html' %}
{% block title %}Registrar Usuario{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-15">
    <div class="card">
      <div class="card-header bg-primary px-5">
        <h4 class="text-white mb-0">Registrar Nuevo Usuario</h4>
      </div>
      <div class="card-body mt-4">
        <form action="{{ url_for('user_bp.register_user') }}" method="POST">
          <div class="row">
            <div class="col-md-12 mb-3">
              <label class="form-label">Nombre y Apellido</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="name_surname" class="form-control" placeholder="Ej: Juan Pérez" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email_user" class="form-control" placeholder="correo@ejemplo.com" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="form-group password-field">
                <label class="form-label" for="pass_user">Contraseña</label>
                <div class="input-group">
                  <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                    <span class="password-eye is-closed" aria-hidden="true">
                      <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        <g class="eye">
                          <circle class="eye-sclera" cy="12" cx="12" r="4" fill="currentColor" />
                          <circle class="eye-pupil" cy="12" cx="12" r="1.5" fill="#000" />
                        </g>
                      </svg>
                    </span>
                    <span class="sr-only visually-hidden">Mostrar contraseña</span>
                  </button>
                  <input id="pass_user" type="password" name="pass_user" class="form-control" placeholder="8-12 caracteres, letras y al menos un carácter especial" required minlength="8" maxlength="12" pattern="(?=.*[A-Za-zÁÉÍÓÚáéíóúÑñ])(?=.*[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ]).{8,12}">
                  <div id="pass_user_feedback" class="invalid-feedback" aria-live="polite"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button type="submit" class="btn btn-success px-5">
              <i class="bi bi-save"></i> Guardar Usuario
            </button>
            <a href="{{ url_for('user_bp.list_users') }}" class="btn btn-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  /* Estilos para que el botón del ojo se vea igual a los iconos de los otros inputs */
  .btn-password-toggle {
    display: flex;
    align-items: center;
    background-color: #e9ecef !important;
    border: 1px solid #ced4da !important;
    color: #495057 !important;
    padding: 0 12px;
    border-radius: 0.375rem 0 0 0.375rem !important;
  }

  .button-password-svg {
    width: 22px;
    height: 22px;
  }

  /* Animación de parpadeo (solo cuando está abierto) */
  @keyframes eye-blink {
    0%, 88%, 100% { transform: scaleY(1); }
    92%, 96% { transform: scaleY(0.1); }
  }

  .button-password-svg .lid {
    transform-origin: center;
    transition: transform 0.3s ease;
  }

  .password-eye.is-open .lid {
    animation: eye-blink 5s infinite;
  }

  /* Estado "Cerrado" (Contraseña oculta) */
  .password-eye.is-closed .eye-pupil,
  .password-eye.is-closed .eye-sclera {
    visibility: hidden;
  }

  .password-eye.is-closed .lid--upper {
    transform: translateY(3px) scaleY(0.1);
  }

  .password-eye.is-closed .lid--lower {
    transform: translateY(-3px) scaleY(0.1);
  }

  .eye-pupil {
    transition: transform 0.05s linear;
  }

  /* Corregir visualización de feedback en input-group */
  .input-group .invalid-feedback {
    width: 100%;
    display: none;
  }
  .input-group .form-control.is-invalid ~ .invalid-feedback {
    display: block;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.querySelector('.btn-password-toggle');
    const passwordInput = document.getElementById('pass_user');
    const eyeSpan = document.querySelector('.password-eye');
    const pupil = document.querySelector('.eye-pupil');

    // Funcionalidad de Mostrar/Ocultar
    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      
      // Cambiar visual del ojo: si mostramos texto, abrimos el ojo.
      if (isHidden) {
        eyeSpan.classList.replace('is-closed', 'is-open');
      } else {
        eyeSpan.classList.replace('is-open', 'is-closed');
      }
    });

    // Ojo que sigue al cursor
    document.addEventListener('mousemove', (e) => {
      // Solo seguir el cursor si el ojo está abierto
      if (!pupil || eyeSpan.classList.contains('is-closed')) return;

      const rect = pupil.getBoundingClientRect();
      const eyeCenterX = rect.left + rect.width / 2;
      const eyeCenterY = rect.top + rect.height / 2;
      const dx = e.clientX - eyeCenterX;
      const dy = e.clientY - eyeCenterY;
      const angle = Math.atan2(dy, dx);
      const distance = Math.min(1.8, Math.sqrt(dx*dx + dy*dy) / 50);
      const moveX = Math.cos(angle) * distance;
      const moveY = Math.sin(angle) * distance;
      pupil.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });
  });
</script>
{% endblock %}
