{% extends 'base_cpanel.html' %}
{% block title %}Registrar Usuarios{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='my-app/static/css/usuarios.css') }}">
{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-9">
    <div class="card">
      <div class="card-header bg-primary px-5">
        <h4 class="text-white mb-0">Registrar Nuevo Usuario</h4>
      </div>
      <div class="card-body mt-4">
        <form action="{{ url_for('user_bp.register_user') }}" method="POST">
          <div class="row">
            <div class="col-md-12 mb-3">
              <label class="form-label">Nombre y Apellido</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Cédula</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" name="cedula_usuario" class="form-control" placeholder="Ej: 12345678" required maxlength="10">
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Rol</label>
              <select name="rol" class="form-control" required>
                <option value="Asistente">Asistente</option>
                <option value="Recepcionista">Recepcionista</option>
                <option value="Gerente">Gerente</option>
                <option value="Presidente">Presidente</option>
                <option value="Administrador">Administrador</option>
                <option value="Proyectista">Proyectista</option>
                <option value="Inspector">Inspector</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="pass_user">Contraseña</label>
              <div class="input-group input-group-merge">
                <input id="pass_user" type="password" name="pass_user" class="form-control" placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;" required minlength="8" maxlength="12" pattern="(?=.*[A-Za-zÁÉÍÓÚáéíóúÑñ])(?=.*[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ]).{8,12}">
              </div>
              <div id="pass_user_feedback" class="invalid-feedback" aria-live="polite"></div>
            </div>
          </div>
          <div class="text-center mt-3">
            <button type="submit" class="btn btn-success px-5">
              <i class="bi bi-save"></i> Registrar Usuario
            </button>
            <a href="{{ url_for('user_bp.list_users') }}" class="btn btn-secondary">
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
{% endblock %}
