{% extends 'base_cpanel.html' %}
{% block title %}Editar Maquinaria{% endblock %}

{% block body %}
<div class="container-xxl flex-grow-1 container-p-y">
    <h4 class="fw-bold py-3 mb-4 text-primary">MODIFICAR MAQUINARIA</h4>
    <div class="card mb-4 shadow-sm" style="border-radius: 0px !important">
        <div class="card-header bg-white border-bottom py-3">
            <h5 class="mb-0 fw-bold text-warning"><i class="bx bx-edit me-1"></i> Editando Registro #{{ maquinaria.id_maquinaria }}</h5>
        </div>
        <div class="card-body">
            <form action="{{ url_for('home_bp.formActualizarMaquinaria') }}" method="POST" class="mt-3" id="formActualizarMaquinaria">
                <input type="hidden" name="id_maquinaria" value="{{ maquinaria.id_maquinaria }}">
                
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-bold">Nombre de la Maquinaria</label>
                        <input type="text" name="nombre_maquinaria" class="form-control" value="{{ maquinaria.nombre_maquinaria }}" required>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Tipo de Maquinaria</label>
                        <select name="tipo_maquinaria" id="tipo_maquinaria" class="form-select" required>
                            <option value="Pesada" {{ 'selected' if maquinaria.tipo_maquinaria == 'Pesada' }}>Pesada</option>
                            <option value="Liviana" {{ 'selected' if maquinaria.tipo_maquinaria == 'Liviana' }}>Liviana</option>
                            <option value="Herramienta" {{ 'selected' if maquinaria.tipo_maquinaria == 'Herramienta' }}>Herramienta</option>
                            <option value="Vehículo" {{ 'selected' if maquinaria.tipo_maquinaria == 'Vehículo' }}>Vehículo</option>
                        </select>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <a href="{{ url_for('home_bp.viewFormMaquinaria') }}" class="btn btn-outline-secondary px-4">
                        <i class="bx bx-arrow-back"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-warning px-4 fw-bold">
                        <i class="bx bx-refresh"></i> Actualizar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block customJS %}
<script src="{{ url_for('static', filename='js/validaciones_comunes.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('formActualizarMaquinaria');
    ValidacionesComunes.initSelects(form);
    ValidacionesComunes.initBotonesSubmit(form, { textoGuardando: 'Actualizando...' });
  });
</script>
{% endblock %}
