{% extends 'base_cpanel.html' %}
{% block title %}INVISAP | Registrar Empresa{% endblock %}
{% block customCSS %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">REGISTRAR EMPRESAS</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
 <form method="POST" action="{{ url_for('procesar_registro') }}" autocomplete="off">
    <div class="card-body">
        <div class="row">
            <div class="col-md-4">
                <label for="rif" class="form-label">RIF Empresa</label>
                <input type="text" class="form-control bg-white" name="rif" placeholder="Ingresa RIF Empresa" required />
            </div>
            <div class="col-md-4">
                <label for="nombre_empresa" class="form-label">Nombre de la Empresa</label>
                <input type="text" class="form-control bg-white" name="nombre_empresa" placeholder="Ingresa Nombre de Empresa" required />
            </div>
            <div class="col-md-4">
                <label form="telefono" class="form-label fw-semibold">Teléfono</label>
               <input type="text" class="form-control bg-white" name="telefono" placeholder="Ingresa Telefono Empresa" required />
              </div>
            </div>
        <div class="col-md-12">
                <label for="domicilio_fiscal" class="form-label">Domicilio Fiscal</label>
                <input type="text" class="form-control bg-white" name="domicilio_fiscal" placeholder="Domicilio Fiscal de la Empresa" required />
            </div>
        </div>
        <div class="mt-5 text-center">
            <button  class="btn btn-primary btn-lg px-5 shadow-sm" style="border-radius: 50px;" type="submit"><i class="bi bi-save me-2"></i>Registrar Empresa</button>
          </div>
    </div>
</form>
    </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} 

{% block customJS %}
<script src="{{ url_for('static', filename ='assets/customJS/file.js') }}"></script>
<script src="{{ url_for('static', filename ='js/empresa.js') }}"></script>
{% endblock %}
