{% extends 'base_cpanel.html' %}
{% block title %}Reportes PDF | INVILARA{% endblock %}

{% block body %}
<div class="row justify-content-center">
  <div class="col-md-11">
    <div class="card shadow border-0">
      <div class="card-header bg-danger py-4 px-5">
        <h4 class="text-white mb-0 fw-bold">
          <i class="bi bi-file-earmark-pdf me-2"></i> Generar Reporte PDF
        </h4>
      </div>
      <div class="card-body mt-4 p-5">
        <form action="{{ url_for('generarReportePDF') }}" method="POST">
          <div class="row justify-content-center">
            
            <div class="col-md-12 text-center mb-5">
              <button type="submit" class="btn btn-danger btn-lg px-5 shadow-sm fw-bold">
                <i class="bi bi-file-pdf me-2"></i> GENERAR REPORTE
              </button>
            </div>

            <div class="col-md-10 mb-4">
              <label class="form-label fw-bold text-dark fs-5">Filtro de Contenido</label>
              <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-light border-end-0 text-danger"><i class="bi bi-search"></i></span>
                <input type="text" name="filtro_busqueda" class="form-control border-start-0" 
                       placeholder="Escriba el módulo (ej: personal). Vacío para reporte general.">
              </div>
            </div>

          </div>
          
          <div class="text-center mt-5">
            <hr class="w-75 mx-auto mb-4">
            <a href="{{ url_for('login_bp.inicio') }}" class="btn btn-secondary px-5">
              <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
