{% extends 'base_cpanel.html' %}
<!--Cambiando el title-->
{% block title %}Crud con Python 🐍 | Perfil {% endblock %}
<!--Inicio del block-->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">MI PERFIL</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-6">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="{{ url_for('login_bp.actualizarPerfil') }}">
        <div class="card-body">
          <div class="mb-3">
            <label for="name_surname" class="form-label">Usuario</label>
            <input
              type="text"
              name="name_surname"
              value="{{ info_perfil_session[0]['name_surname'] }}"
              class="form-control"
              required />
          </div>
          <div class="mb-3">
            <label for="email_user" class="form-label">Email</label>
            <input
              class="form-control"
              type="email"
              name="email_user"
              value="{{ info_perfil_session[0]['email_user'] }}"
              readonly />
          </div>
          <div class="mb-3 form-password-toggle">
            <label class="form-label" for="pass_actual">Clave Actual</label>
            <div class="password-input-wrapper input-group input-group-merge">
              <input
                type="password"
                class="form-control password-reveal-input"
                name="pass_actual"
                id="pass_actual"
                placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                aria-describedby="password" />
              <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                <span class="password-eye" aria-hidden="true">
                  <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <g class="eye">
                      <circle cy="12" cx="12" r="4" fill="currentColor" />
                      <circle cy="11" cx="13" r="1" fill="#000" />
                    </g>
                  </svg>
                </span>
                <span class="sr-only visually-hidden">Mostrar contraseña</span>
              </button>
            </div>
          </div>
          <div class="mb-3 form-password-toggle">
            <label class="form-label" for="new_pass_user">Nueva Clave</label>
            <div class="password-input-wrapper input-group input-group-merge">
              <input
                type="password"
                class="form-control password-reveal-input"
                name="new_pass_user"
                id="new_pass_user"
                placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                aria-describedby="password" />
              <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                <span class="password-eye" aria-hidden="true">
                  <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <g class="eye">
                      <circle cy="12" cx="12" r="4" fill="currentColor" />
                      <circle cy="11" cx="13" r="1" fill="#000" />
                    </g>
                  </svg>
                </span>
                <span class="sr-only visually-hidden">Mostrar contraseña</span>
              </button>
            </div>
          </div>
          <div class="mb-3 form-password-toggle">
            <label class="form-label" for="repetir_pass_user">
              Repetir Nueva Clave
            </label>
            <div class="password-input-wrapper input-group input-group-merge">
              <input
                type="password"
                class="form-control password-reveal-input"
                name="repetir_pass_user"
                id="repetir_pass_user"
                placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                aria-describedby="password" />
              <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                <span class="password-eye" aria-hidden="true">
                  <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <g class="eye">
                      <circle cy="12" cx="12" r="4" fill="currentColor" />
                      <circle cy="11" cx="13" r="1" fill="#000" />
                    </g>
                  </svg>
                </span>
                <span class="sr-only visually-hidden">Mostrar contraseña</span>
              </button>
            </div>
          </div>
        </div>
        <div class="mb-3 text-center">
          <button type="submit" class="btn rounded-pill btn-primary">
            Actualizar mis datos
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
