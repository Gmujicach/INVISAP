{% extends 'base_cpanel.html' %}
{% block title %}Invilara | Editar Contratación{% endblock %}
{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

{% block body %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm" style="border-radius: 0px !important">
        <div class="card-header bg-white border-bottom py-3">
          <h5 class="mb-0 text-primary fw-bold">
            <i class="bx bx-edit-alt me-2"></i>MODIFICAR CONTRATACIÓN N°: {{ contratacion.numero_contrato }}
          </h5>
        </div>
        
        <form class="form-horizontal" method="POST" action="{{ url_for('contrataciones_bp.procesar_actualizacion') }}" autocomplete="off">
          
          <input type="hidden" name="id_contratacion" value="{{ contratacion.id_contratacion }}">
          
          <div class="card-body">
            
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-muted">Empresa Ganadora</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bx bx-building"></i></span>
                  <input type="text" class="form-control" name="empresa_ganadora" value="{{ contratacion.empresa_ganadora }}" required />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-muted">RIF de la Empresa</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bx bx-id-card"></i></span>
                  <input type="text" class="form-control" name="empresa_rif" value="{{ contratacion.empresa_rif }}" required />
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold text-muted">Descripción de la Contratación</label>
              <textarea class="form-control" rows="2" name="descripcion" required>{{ contratacion.descripcion }}</textarea>
            </div>
            
            <hr class="mb-4 text-muted">

            <div class="row mb-4">
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Número de Contrato</label>
                <input type="text" class="form-control shadow-sm bg-light" name="numero_contrato" value="{{ contratacion.numero_contrato }}" readonly />
                <small class="text-muted">No editable por seguridad.</small>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Monto ($ / Bs)</label>
                <input type="text" class="form-control shadow-sm" name="monto" value="{{ contratacion.monto }}" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Tipo de Contrato</label>
                <input type="text" class="form-control shadow-sm" name="tipo_contrato" value="{{ contratacion.tipo_contrato }}" required />
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Modalidad</label>
                <input type="text" class="form-control shadow-sm" name="modalidad" value="{{ contratacion.modalidad }}" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Objeto</label>
                <input type="text" class="form-control shadow-sm" name="objeto" value="{{ contratacion.objeto }}" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Observación</label>
                <input type="text" class="form-control shadow-sm" name="observacion" value="{{ contratacion.observacion if contratacion.observacion else '' }}" />
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Inicio Procedimiento</label>
                <input type="date" class="form-control shadow-sm" name="fecha_inicio_procedimiento" value="{{ contratacion.fecha_inicio_procedimiento }}" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Fecha Adjudicación</label>
                <input type="date" class="form-control shadow-sm" name="fecha_adjudicacion" value="{{ contratacion.fecha_adjudicacion }}" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold text-secondary">Fecha de Registro</label>
                <input type="date" class="form-control shadow-sm" name="fecha_registro" value="{{ contratacion.fecha_registro }}" required />
              </div>
            </div>

          </div>

          <div class="card-footer bg-light py-3 d-flex justify-content-between">
            <a href="{{ url_for('contrataciones_bp.gestionar_contrataciones') }}" class="btn btn-outline-secondary px-4 rounded-pill">
              <i class="bx bx-arrow-back me-1"></i> Volver
            </a>
            <button type="submit" class="btn btn-warning px-5 rounded-pill fw-bold">
              Guardar Cambios <i class="bx bx-refresh ms-1"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
