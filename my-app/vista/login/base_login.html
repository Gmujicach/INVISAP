<!DOCTYPE html>
<html
  lang="es"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="../assets/"
  data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>{% block title %}Sistema Invilara{% endblock %}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='assets/img/NUEVO-LOGO-GOBERNACION-DE-LARA-JUNIO-2025.ico') }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/vendor/fonts/boxicons.css') }}" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/vendor/css/core.css') }}"
      class="template-customizer-core-css" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/vendor/css/theme-default.css') }}"
      class="template-customizer-theme-css" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css') }}" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/vendor/css/pages/page-auth.css') }}" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/my_style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/notifications.css') }}" />
    <!-- Estilos globales de Modo Oscuro (carga al final para prevalecer) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/dark-mode.css') }}" />

    <script src="{{ url_for('static', filename='assets/vendor/js/helpers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  </head>

   <body class="dark-mode-available">
    <div id="loader-out">
      <div id="loader-container">
        <p id="loading-text">Cargando</p>
      </div>
    </div>

    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    </script>

    {% include 'includes/messages.html' %}
    
    <!-- Theme Toggle -->
    <button type="button" id="login-dark-toggle" class="btn btn-outline-secondary" style="position: fixed; top: 14px; right: 14px; z-index: 1050; border-radius: 50%; width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" aria-label="Cambiar modo oscuro" title="Modo Oscuro">
      <i class="bx bx-moon" id="login-theme-icon"></i>
    </button>
    
    <!--cuerpo-->
    {% block body %}
    <!--Include-->
    {% include 'login/auth_login.html' %}
    <!--fin del cuerpo-->
    {% endblock %}

    <!-- Scripts al final del body para mejor rendimiento -->
    <script src="{{ url_for('static', filename='js/home/home.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
      }
    </script>
  </body>
</html>
