<div class="container-xxl">
  <div class="authentication-wrapper authentication-basic container-p-y">
    <div class="authentication-inner" style="position: relative; z-index: 1;">
      <div class="card">
        <div class="card-body">
          <div class="app-brand justify-content-center">
            <span class="app-brand-logo">
              <img
              src="{{ url_for('static', filename ='assets/img/NUEVO LOGO GOBERNACION DE LARA JUNIO 2025.png') }}"
          alt="Logo" 
          style="max-height: 48px; max-width: 160px; object-fit: contain; width: auto; height: auto;" />
            </span>
          </div>

          <form
            id="formAuthentication"
            class="mb-3"
            action="{{ url_for('login_bp.loginCliente') }}"
            method="POST">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                name="email_user"
                placeholder="Escribe tu email"
                autofocus
                required />
            </div>
            <div class="mb-3 form-password-toggle">
              <div class="d-flex justify-content-between">
                <label class="form-label" for="password">Clave</label>
                <a href="{{ url_for('cpanelRecoveryPassUser') }}">
                  <small>Olvidó su Clave?</small>
                </a>
              </div>
              <div class="password-input-wrapper input-group input-group-merge">
                <input
                  type="password"
                  class="form-control password-reveal-input"
                  name="pass_user"
                  id="pass_user"
                  placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                  aria-describedby="password"
                  required />
                <button type="button" class="btn btn-outline-secondary btn-password-toggle" tabindex="-1" aria-label="Mostrar contraseña">
                  <span class="password-eye" aria-hidden="true">
                    <svg class="button-password-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path class="lid lid--upper" d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                      <path class="lid lid--lower" d="M1 12C1 12 5 20 12 20C19 20 23 12 23 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                      <g class="eye">
                        <circle cy="12" cx="12" r="4" fill="currentColor" />
                        <circle cy="11" cx="13" r="1" fill="#000" />
                      </g>
                    </svg>
                  </span>
                  <span class="sr-only visually-hidden">Mostrar contraseña</span>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <button class="btn btn-primary w-100" type="submit">
                Entrar ahora
                <i class="bi bi-arrow-right-circle"></i>
              </button>
            </div>
          </form>

          <p class="text-center">
            <a href="./register-user">
              <span>Crear mi cuenta</span>
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
