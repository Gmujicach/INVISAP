{% block body %}
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/login.css') }}">

<div class="container-xxl">
  <div class="authentication-wrapper authentication-basic container-p-y">
    <div class="authentication-inner" style="position: relative; z-index: 1;">
      <div class="card">
        <div class="card-body">
          <div class="app-brand justify-content-center">
            <span class="app-brand-logo">
              <img
                src="{{ url_for('static', filename ='assets/img/NUEVO LOGO GOBERNACION DE LARA JUNIO 2025.png') }}"
                alt="Logo" 
                style="max-height: 85px; max-width: 160px; object-fit: contain; width: auto; height: auto;" />
            </span>
          </div>

          <h4 class="mb-2">¡Bienvenido al Sistema Invilara!</h4>
          <p class="mb-2">ingrese sus credenciales</p>

          <form
            id="formAuthentication"
            class="mb-3"
            action="{{ url_for('login_bp.loginCliente') }}"
            method="POST">
            
            <div class="mb-3">
              <label for="nombre" class="form-label text-heading fw-semibold">Usuario</label>
              <input
                type="text"
                class="form-control custom-placeholder border-secondary-subtle"
                id="nombre"
                name="nombre"
                placeholder="Escriba su usuario (Ej: jmedina)"
                autofocus
                required />
            </div>
            
            <div class="mb-3 molecule-password-field position-relative">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="pass_user" class="form-label text-heading fw-semibold mb-0">Clave de Acceso</label>
                <a href="{{ url_for('login_bp.cpanelRecoveryPassUser') }}" class="small text-primary fw-medium">
                  ¿Olvidó su Clave?
                </a>
              </div>
              
              <div class="input-group input-group-merge">
                <input
                  type="password"
                  id="pass_user"
                  class="form-control password-input custom-placeholder border-end-0 border-secondary-subtle"
                  name="pass_user"
                  placeholder="Mín. 8 caracteres, letras y un símbolo (Ej: Invi2026*)"
                  required />
                
                <button 
                  type="button" 
                  class="input-group-text password-toggle-btn border-start-0 border-secondary-subtle px-3" 
                  style="background-color: #fff; cursor: pointer;">
                  <i class="bi bi-eye-slash toggle-icon fs-5 text-muted"></i>
                </button>
              </div>

              <div class="password-strength-widget d-none mt-2">
                <ul class="list-unstyled mb-2">
                  <li class="rule-item transition-all" data-rule="length">
                    <i class="bi bi-circle me-2 icon-rule"></i> De 8 a 12 caracteres
                  </li>
                  <li class="rule-item transition-all" data-rule="symbol">
                    <i class="bi bi-circle me-2 icon-rule"></i> Un símbolo especial
                  </li>
                </ul>
                
                <div class="strength-indicator-header d-flex justify-content-between align-items-center mb-2">
                  <span class="small fw-semibold text-heading">Seguridad:</span>
                  <span class="strength-label badge bg-label-secondary">Esperando...</span>
                </div>
                
                <div class="progress" style="height: 6px; background-color: rgba(67, 89, 113, 0.1);">
                  <div class="strength-meter progress-bar transition-all" role="progressbar" style="width: 0%;"></div>
                </div>
              </div>

              <div id="passwordHelp" class="form-text text-muted d-none mt-2">
                <small><i class="bi bi-info-circle me-1"></i> Validación de seguridad activa.</small>
              </div>
            </div>

            <div class="mb-3 pt-2">
              <button class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center" type="submit">
                <span>Iniciar Sesión</span>
                <i class="bi bi-arrow-right-circle ms-2 fs-5"></i>
              </button>
            </div>
          </form>

          <p class="text-center">
            <a href="{{ url_for('login_bp.cpanelRegisterUser') }}">
              <span>Crear mi cuenta</span>
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
