<!-- Atomic Styles -->
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/login.css') }}">

<div class="container-xxl">
  <div class="authentication-wrapper authentication-basic container-p-y">
    <div class="authentication-inner" style="position: relative; z-index: 1;">
      <div class="card">
        <div class="card-body">
          <div class="app-brand justify-content-center">
            <span class="app-brand-logo">
              <img
              src="{{ url_for('static', filename ='assets/img/NUEVO LOGO GOBERNACION DE LARA JUNIO 2025.png') }}"
          alt="Logo" 
          style="max-height: 48px; max-width: 160px; object-fit: contain; width: auto; height: auto;" />
            </span>
          </div>

          <form
            id="formAuthentication"
            class="mb-3"
            action="{{ url_for('login_bp.loginCliente') }}"
            method="POST">
            <div class="mb-3">
              <label for="nombre" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                name="nombre"
                placeholder="Escribe tu nombre de usuario"
                autofocus
                required />
            </div>
            <div class="mb-3 molecule-password-field position-relative">
              <div class="d-flex justify-content-between">
                <label class="form-label">Clave</label>
                <a href="{{ url_for('login_bp.cpanelRecoveryPassUser') }}">
                  <small>Olvidó su Clave?</small>
                </a>
              </div>
              <div class="input-group input-group-merge">
                <input
                  type="password"
                  class="form-control password-input border-end-0"
                  name="pass_user"
                  placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                  aria-describedby="strength-meter"
                  required />
                <!-- Atomic Toggle Button -->
                <button type="button" class="btn btn-outline-secondary password-toggle-btn px-3 border-start-0" aria-label="Revelar">
                  <i class="bi bi-eye-slash fs-5 toggle-icon"></i>
                </button>
              </div>

              <!-- Password Strength Checker Widget (Organismo Reutilizable) -->
              <div class="password-strength-widget password-strength-wrapper mt-3 d-none">
                <p class="password-strength-description small text-muted mb-2 fw-semibold">Tu contraseña debe incluir:</p>
                <ul class="password-strength-list list-unstyled mb-3">
                  <li class="rule-item d-flex align-items-center mb-1 text-danger transition-all" data-rule="length">
                    <i class="bi bi-circle me-2 icon-rule"></i> 8 a 12 caracteres
                  </li>
                  <li class="rule-item d-flex align-items-center mb-1 text-danger transition-all" data-rule="upper-lower">
                    <i class="bi bi-circle me-2 icon-rule"></i> Mayúsculas y minúsculas
                  </li>
                  <li class="rule-item d-flex align-items-center mb-1 text-danger transition-all" data-rule="symbol">
                    <i class="bi bi-circle me-2 icon-rule"></i> Un símbolo especial
                  </li>
                </ul>
                
                <div class="strength-indicator-header d-flex justify-content-between align-items-center mb-2">
                  <span class="small fw-semibold text-heading">Seguridad:</span>
                  <span class="strength-label badge bg-label-secondary">Esperando...</span>
                </div>
                
                <div class="progress" style="height: 6px; background-color: rgba(67, 89, 113, 0.1);">
                  <div class="strength-meter progress-bar transition-all" role="progressbar" style="width: 0%;"></div>
                </div>
              </div>

              <div id="passwordHelp" class="form-text text-muted d-none mt-2">
                <small><i class="bi bi-info-circle me-1"></i> Validación de seguridad activa.</small>
              </div>
            </div>
            <div class="mb-3">
              <button class="btn btn-primary w-100" type="submit">
                Entrar ahora
                <i class="bi bi-arrow-right-circle"></i>
              </button>
            </div>
          </form>

          <p class="text-center">
            <a href="{{ url_for('login_bp.cpanelRegisterUser') }}">
              <span>Crear mi cuenta</span>
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
