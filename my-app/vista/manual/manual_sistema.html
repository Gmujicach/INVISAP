<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual del Sistema | INVILARA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}">
  <!-- Librería local de guías interactivas (Driver.js) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='js/driver/driver.css') }}">
  <!-- Estándar global de botones de acción y modales -->
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/estandar-acciones.css') }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f8;
      display: flex;
      flex-direction: column;
    }
    .manual-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #087A24;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    .manual-toolbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .manual-toolbar .brand i { color: #FFC107; font-size: 1.3rem; }
    .manual-actions { display: flex; gap: 8px; }
    .manual-actions a, .manual-actions button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      color: #212529;
      background: #FFC107;
      transition: filter .2s ease;
    }
    .manual-actions a.secondary, .manual-actions button.secondary {
      background: #fff;
      color: #087A24;
    }
    .manual-actions a:hover, .manual-actions button:hover { filter: brightness(.95); }
    .manual-frame {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      background: #fff;
    }
    .manual-fallback {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .manual-fallback a { color: #087A24; font-weight: 700; }

    /* Dark mode para Manual */
    body.dark-mode {
      background: #232333 !important;
    }
    body.dark-mode .manual-toolbar {
      background: #0a2e18 !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.45) !important;
    }
    body.dark-mode .manual-frame {
      background: #1e1e2d !important;
    }
    body.dark-mode .manual-actions a,
    body.dark-mode .manual-actions button {
      background: #3d320e !important;
      color: #ffda6a !important;
    }
    body.dark-mode .manual-actions a.secondary,
    body.dark-mode .manual-actions button.secondary {
      background: #2b2c40 !important;
      color: #4ade80 !important;
    }
    body.dark-mode .manual-fallback a {
      color: #4ade80 !important;
    }

    /* --- Botón flotante de la guía interactiva (mismo estándar del sistema) --- */
    .tour-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: linear-gradient(135deg, #08b324 0%, #059b1f 100%);
      color: #fff;
      font-size: 1.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(8, 179, 36, 0.5);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .tour-fab:hover {
      transform: translateY(-1px) scale(1.06);
      box-shadow: 0 10px 28px rgba(8, 179, 36, 0.65);
      filter: brightness(1.05);
    }
    .tour-fab.tour-active {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      box-shadow: 0 8px 24px rgba(220, 53, 69, 0.5);
    }
    @media (max-width: 767.98px) {
      .tour-fab { bottom: 18px; right: 18px; width: 54px; height: 54px; }
    }
  </style>
</head>
<body>
  <div class="manual-toolbar">
    <div class="brand">
      <i class="bi bi-journal-bookmark-fill"></i>
      <span>Manual del Sistema &mdash; INVILARA</span>
    </div>
    <div class="manual-actions">
      <a href="{{ pdf_url }}" target="_blank" download>
        <i class="bi bi-download"></i> Descargar
      </a>
      <button class="secondary" onclick="window.print()">
        <i class="bi bi-printer"></i> Imprimir
      </button>
      <button class="secondary" onclick="window.close()">
        <i class="bi bi-x-lg"></i> Cerrar
      </button>
    </div>
  </div>

  <iframe
    class="manual-frame"
    src="{{ pdf_url }}#toolbar=1&navpanes=1&view=FitH"
    title="Manual del Sistema INVILARA">
  </iframe>

  <noscript>
    <div class="manual-fallback">
      <p>Tu navegador no admite la visualizacion embebida.
         <a href="{{ pdf_url }}" target="_blank">Abre el Manual del Sistema en PDF</a>.</p>
    </div>
  </noscript>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
  <button type="button" id="manual-dark-toggle" style="position: fixed; top: 10px; right: 10px; z-index: 1050; border-radius: 50%; width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; cursor: pointer;" aria-label="Cambiar modo oscuro" title="Modo Oscuro">
    <i class="bi bi-moon" id="manual-theme-icon"></i>
  </button>
  <script>
    var manualToggle = document.getElementById('manual-dark-toggle');
    var manualIcon = document.getElementById('manual-theme-icon');
    if (manualToggle) {
      var initDark = document.body.classList.contains('dark-mode');
      if (manualIcon) manualIcon.className = initDark ? 'bi bi-sun' : 'bi bi-moon';
      manualToggle.addEventListener('click', function() {
        var isDark = document.body.classList.toggle('dark-mode');
        document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        if (manualIcon) manualIcon.className = isDark ? 'bi bi-sun' : 'bi bi-moon';
      });
    }
  </script>
  <!-- Botón flotante de la guía interactiva del módulo -->
  <button type="button" class="tour-fab" id="btnTourInvilara" title="Guía del Sistema" aria-label="Iniciar tour del sistema" aria-pressed="false">
    <i class="bi bi-question-lg"></i>
  </button>

  <script src="{{ url_for('static', filename='js/driver/driver.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tour/tour-manager.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tour/manual/tour.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var fab = document.getElementById('btnTourInvilara');
      if (fab) {
        fab.addEventListener('click', function () {
          if (window.INVISAP_TOUR_MANAGER) {
            window.INVISAP_TOUR_MANAGER.toggleTour('manual');
          }
        });
      }
    });
  </script>
</body>
</html>
