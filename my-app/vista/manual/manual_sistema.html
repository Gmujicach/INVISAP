<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual del Sistema | INVILARA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f8;
      display: flex;
      flex-direction: column;
    }
    .manual-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      background: #087A24;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    .manual-toolbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .manual-toolbar .brand i { color: #FFC107; font-size: 1.3rem; }
    .manual-actions { display: flex; gap: 8px; }
    .manual-actions a, .manual-actions button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      color: #212529;
      background: #FFC107;
      transition: filter .2s ease;
    }
    .manual-actions a.secondary, .manual-actions button.secondary {
      background: #fff;
      color: #087A24;
    }
    .manual-actions a:hover, .manual-actions button:hover { filter: brightness(.95); }
    .manual-frame {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      background: #fff;
    }
    .manual-fallback {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }
    .manual-fallback a { color: #087A24; font-weight: 700; }
  </style>
</head>
<body>
  <div class="manual-toolbar">
    <div class="brand">
      <i class="bi bi-journal-bookmark-fill"></i>
      <span>Manual del Sistema &mdash; INVILARA</span>
    </div>
    <div class="manual-actions">
      <a href="{{ pdf_url }}" target="_blank" download>
        <i class="bi bi-download"></i> Descargar
      </a>
      <button class="secondary" onclick="window.print()">
        <i class="bi bi-printer"></i> Imprimir
      </button>
      <button class="secondary" onclick="window.close()">
        <i class="bi bi-x-lg"></i> Cerrar
      </button>
    </div>
  </div>

  <iframe
    class="manual-frame"
    src="{{ pdf_url }}#toolbar=1&navpanes=1&view=FitH"
    title="Manual del Sistema INVILARA">
  </iframe>

  <noscript>
    <div class="manual-fallback">
      <p>Tu navegador no admite la visualizacion embebida.
         <a href="{{ pdf_url }}" target="_blank">Abre el Manual del Sistema en PDF</a>.</p>
    </div>
  </noscript>
<script src="{{ url_for('static', filename='js/tour/manual/tour.js') }}"></script>
</body>
</html>
