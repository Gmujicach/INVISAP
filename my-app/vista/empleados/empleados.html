{% extends 'base_cpanel.html' %}
{% block title %}Gestionar Empleados{% endblock %}

{% block customCSS %}
<!-- Reutilizamos los estilos del dashboard de usuarios -->
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/usuarios.css') }}">
{% endblock %}

{% block body %}
<div class="container-fluid p-0">
    <!-- Contenedor de carga mientras se activa el dashboard -->
    <div class="text-center mt-5">
        <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h5 class="mt-3 fw-semibold">Cargando Gestión de Empleados...</h5>
        <p class="text-muted">Iniciando panel interactivo.</p>
    </div>
</div>
{% endblock %}

{% block customJS %}
<!-- Cargamos la lógica de usuarios para heredar las funciones openDashboard/closeDashboard -->
<script src="{{ url_for('static', filename='assets/js/usuarios.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/empleados.js') }}"></script>
<script>
    // Inyectamos los datos de empleados a la ventana global para JS
    window.resp_empleadosBD = {{ empleados | tojson | safe }};
    
    document.addEventListener('DOMContentLoaded', function() {
        // Disparamos el dashboard automáticamente al cargar la vista
        if (typeof triggerEmpleadosDashboard === 'function') {
            triggerEmpleadosDashboard();
        }
    });
</script>
{% endblock %}
