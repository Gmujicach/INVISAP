{% extends 'base_cpanel.html' %}
{% block title %}Listar Empleados{% endblock %}

{% block customCSS %}
<!-- Reutilizamos los estilos del dashboard de usuarios -->
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/usuarios.css') }}">
{% endblock %}

{% block body %}
<div class="container-xxl flex-grow-1 container-p-y">
    <!-- Contenedor de carga mientras se activa el dashboard -->
    <div class="d-flex flex-column align-items-center justify-content-center mt-5" style="min-height: 400px;">
        <div class="spinner-grow text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Procesando...</span>
        </div>
        <div class="mt-4 text-center">
            <h5 class="fw-bold text-primary mb-1">Cargando Gestión de Empleados</h5>
            <p class="text-muted">Preparando panel interactivo e información del sistema...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block customJS %}
<!-- Cargamos la lógica de usuarios para heredar las funciones openDashboard/closeDashboard -->
<script src="{{ url_for('static', filename='assets/js/usuarios.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/empleados.js') }}"></script>
<script>
    // Inyectamos los datos de empleados a la ventana global para JS
    window.resp_empleadosBD = {{ resp_empleadosBD | tojson | safe }};
    
    document.addEventListener('DOMContentLoaded', function() {
        // Disparamos el dashboard automáticamente al cargar la vista
        if (typeof triggerEmpleadosDashboard === 'function') {
            triggerEmpleadosDashboard();
        }
    });
</script>
{% endblock %}
