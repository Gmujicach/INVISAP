{% extends 'vista/base_cpanel.html' %}
{% block title %}Editar Empleado{% endblock %}
{% block body %}
<div class="card">
  <div class="card-header"><h5>Editar Empleado</h5></div>
  <div class="card-body">
    <form action="{{ url_for('empleado_bp.update_empleado') }}" method="post" enctype="multipart/form-data" id="formEmpleadoUpdate">
      <input type="hidden" name="id_empleado" value="{{ empleado.id_empleado }}">
      <div class="mb-3">
        <label>Nombre</label>
        <input name="nombre_empleado" class="form-control" value="{{ empleado.nombre_empleado }}" required>
      </div>
      <div class="mb-3">
        <label>Apellido</label>
        <input name="apellido_empleado" class="form-control" value="{{ empleado.apellido_empleado }}" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input name="email_empleado" type="email" class="form-control" value="{{ empleado.email_empleado }}" required>
      </div>
      <div class="mb-3">
        <label>Salario</label>
        <input name="salario_empleado" class="form-control" value="{{ empleado.salario_empleado }}" required>
      </div>
      <div class="mb-3">
        <label>Foto (opcional)</label>
        <input type="file" name="foto_empleado" class="form-control">
        {% if empleado.foto_empleado %}
        <div class="mt-2"><img src="{{ url_for('static', filename='fotos_empleados/' ~ empleado.foto_empleado) }}" style="height:60px"></div>
        {% endif %}
      </div>
      <button class="btn btn-success">Actualizar</button>
    </form>
  </div>
</div>
{% endblock %}

{% block customJS %}
<script src="{{ url_for('static', filename='assets/js/empleados_validation.js') }}"></script>
{% endblock %}
