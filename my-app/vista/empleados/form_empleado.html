{% extends 'base_cpanel.html' %}
{% block title %}Registrar Empleado{% endblock %}
{% block body %}
<div class="card">
  <div class="card-header"><h5>Registrar Empleado</h5></div>
  <div class="card-body">
    <form action="{{ url_for('empleado_bp.create_empleado') }}" method="post" enctype="multipart/form-data" id="formEmpleado">
      <div class="mb-3">
        <label>Nombre</label>
        <input name="nombre_empleado" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Apellido</label>
        <input type="text" name="apellido_empleado" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label d-block">Sexo</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="sexo_empleado" id="sexo_masculino" value="1" required>
          <label class="form-check-label" for="sexo_masculino">Masculino</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="sexo_empleado" id="sexo_femenino" value="2" required>
          <label class="form-check-label" for="sexo_femenino">Femenino</label>
        </div>
      </div>
      <div class="mb-3">
        <label>Teléfono</label>
        <input type="text" name="telefono_empleado" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input name="email_empleado" type="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Profesión</label>
        <input type="text" name="profesion_empleado" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Salario</label>
        <input name="salario_empleado" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Foto</label>
        <input type="file" name="foto_empleado" class="form-control">
      </div>
      <button class="btn btn-success">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}

{% block customJS %}
<script src="{{ url_for('static', filename='assets/js/empleados_validation.js') }}"></script>
{% endblock %}
