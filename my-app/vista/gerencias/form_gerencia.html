{% extends 'base_cpanel.html' %}
{% block title %}Crud con Python 🐍 | Registrar Gerencia{% endblock %}
{% block customCSS %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">REGISTRAR GERENCIA</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="/form-registrar-gerencias"
        autocomplete="off">
        <div class="card-body">
          
          <div class="row">
            <div class="col-md-6">
              <label for="nombre_gerencia" class="form-label">
                Nombre de la Gerencia
              </label>
              <input
                type="text"
                name="nombre_gerencia"
                class="form-control"
                maxlength="50"
                required />
            </div>
            <div class="col-md-6">
              <label for="id_solicitud" class="form-label">
                ID de la Solicitud
              </label>
              <input
                type="number"
                name="id_solicitud"
                class="form-control"
                required />
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-12">
              <label for="direccion_gerencia" class="form-label">
                Dirección de la Gerencia
              </label>
              <input
                type="text"
                name="direccion_gerencia"
                class="form-control"
                maxlength="100"
                required />
            </div>
          </div>

          <hr class="mt-4 mb-3" />
          <h5 class="text-secondary mb-3">Datos del Gerente</h5>

          <div class="row">
            <div class="col-md-6">
              <label for="nombre_gerante" class="form-label">
                Nombre y Apellido
              </label>
              <input
                type="text"
                name="nombre_gerante"
                class="form-control"
                maxlength="50"
                required />
            </div>
            <div class="col-md-6">
              <label for="cedula_gerante" class="form-label">
                Cédula
              </label>
              <input
                type="text"
                name="cedula_gerante"
                class="form-control"
                maxlength="15"
                required />
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-6">
              <label for="correo_gerente" class="form-label">
                Correo Electrónico
              </label>
              <input
                type="email"
                name="correo_gerente"
                class="form-control"
                maxlength="50"
                required />
            </div>
            <div class="col-md-6">
  <label for="telefono_gerente" class="form-label">Teléfono(s)</label>
  
  <div id="contenedor-telefonos">
    <div class="input-group mb-2">
      <input
        type="text"
        name="telefono_gerente[]"
        class="form-control"
        maxlength="20"
        required />
      <button class="btn btn-outline-primary" type="button" id="btn-agregar-telefono">
        +
      </button>
    </div>
  </div>
</div>

          <div class="row mt-2">
            <div class="col-md-12">
              <label for="direccion_gerente" class="form-label">
                Dirección del Gerente
              </label>
              <input
                type="text"
                name="direccion_gerente"
                class="form-control"
                maxlength="100"
                required />
            </div>
          </div>

          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn rounded-pill btn-primary">
              Registrar Gerencia
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} 

{% block customJS %}
<script src="{{ url_for('static', filename ='assets/customJS/file.js') }}"></script>
<script src="{{ url_for('static', filename ='assets/js/gerencias.js') }}"></script>
{% endblock %}
