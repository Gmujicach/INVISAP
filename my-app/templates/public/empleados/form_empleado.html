{% extends 'public/base_cpanel.html' %}
<!--Cambiando el title-->
{% block title %}Crud con Python 🐍 | Registrar Publicación{% endblock %}
<!---->
{% block customCSS %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename ='assets/css/file.css') }}" />
{% endblock %}

<!--Inicio del block-->
{% block body %}
<div class="card" style="border-radius: 0px !important">
  <div class="row justify-content-center mb-2">
    <div class="col-md-12">
      <h3 class="text-center mt-5 mb-3">REGISTRAR NUEVA PUBLICACIÓN</h3>
      <hr />
    </div>
  </div>

  <div class="row justify-content-center mb-2">
    <div class="col-md-10">
      <form
        class="form-horizontal mx-auto"
        method="POST"
        action="/form-registrar-publicacion"
        autocomplete="off">
        <div class="card-body">
          
          <div class="row">
            <div class="col-md-6">
              <label for="titulo_publicacion" class="form-label">
                Título de la publicación
              </label>
              <input
                type="text"
                name="titulo_publicacion"
                class="form-control"
                maxlength="30"
                required />
            </div>
            <div class="col-md-6">
              <label for="nombre_responsable" class="form-label">
                Nombre del responsable
              </label>
              <input
                class="form-control"
                type="text"
                name="nombre_responsable"
                maxlength="30"
                required />
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-6">
              <label for="fecha_publicacion" class="form-label">
                Fecha de publicación
              </label>
              <input
                class="form-control"
                type="datetime-local"
                name="fecha_publicacion"
                required />
            </div>
            <div class="col-md-6">
              <label for="tipo_publicacion" class="form-label">
                Tipo de publicación
              </label>
              <input
                class="form-control"
                type="text"
                name="tipo_publicacion"
                maxlength="30"
                placeholder="Ej. Informativa, Técnica, Prensa"
                required />
            </div>
          </div>

          <div class="mb-3 mt-4 text-center">
            <button type="submit" class="btn rounded-pill btn-primary">
              Registrar
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} 

{% block customJS %}
<script src="{{ url_for('static', filename ='assets/customJS/file.js') }}"></script>
{% endblock %}
