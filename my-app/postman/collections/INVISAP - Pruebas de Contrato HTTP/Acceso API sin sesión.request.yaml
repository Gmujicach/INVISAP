$kind: http-request
description: "Comprueba que la API de solicitudes no entregue datos si no hay sesión."
url: "{{baseUrl}}/api/obtener-solicitudes-json"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set("session_cookie", "");
      pm.request.headers.remove("Cookie");
  - type: afterResponse
    language: text/javascript
    code: |-
      // EAFIT - Caja Negra: Partición Equivalente (clase inválida: sin autenticación)
      // Criterio: el sistema debe rechazar accesos no autenticados con 401, 403 o 302
      pm.test("Sin sesión: responde 401 Unauthorized, 403 Forbidden o 302 Redirect", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403, 302]);
      });

      pm.test("El tiempo de respuesta es menor a 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      if (pm.response.code === 401 || pm.response.code === 403) {
          pm.test("Respuesta JSON con campo error o message (no expone datos)", function () {
              try {
                  const json = pm.response.json();
                  pm.expect(json).to.have.any.keys('error', 'message', 'msg');
              } catch(e) {
                  // Respuesta no-JSON también es aceptable para 401/403
              }
          });
      }
settings: {}
order: 100
