$kind: http-request
url: "{{baseUrl}}/api/proyecto/validar-codigo/{{codigo_proyecto}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // EAFIT - Caja Negra: Partición Equivalente - Módulo Transaccional Proyectos
      // Clase válida: codigo_proyecto existente (FRE-001) → 200 con estado del proyecto
      // Clase inválida: código inexistente → 200 con disponible=true o 404
      pm.test("El endpoint responde con éxito (200 OK)", function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      pm.test("El tiempo de respuesta del servidor Flask es menor a 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("Content-Type es application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("application/json");
      });

      pm.test("La respuesta contiene estructura JSON válida", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an('object');
      });

      pm.test("Partición Equivalente: la respuesta indica disponibilidad o estado del código", function () {
          const json = pm.response.json();
          const tieneEstado = json.hasOwnProperty('disponible') ||
                              json.hasOwnProperty('existe') ||
                              json.hasOwnProperty('estado') ||
                              json.hasOwnProperty('valido');
          pm.expect(tieneEstado, "Se esperaba campo disponible/existe/estado/valido").to.be.true;
      });
    language: text/javascript
order: 5000
