$kind: http-request
url: "{{baseUrl}}/api/gravedad/listar"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // EAFIT - Caja Negra: Partición Equivalente + Análisis de Valor Límite
      // Catálogo de Gravedad: valores numéricos 1-5 (límite inferior=1, superior=5)
      pm.test("El endpoint responde con éxito (200 OK)", function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      pm.test("El tiempo de respuesta del servidor Flask es menor a 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("Content-Type es application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("application/json");
      });

      pm.test("La respuesta es un array JSON de gravedades", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an('array');
      });

      pm.test("Análisis Valor Límite: cada gravedad tiene nivel numérico válido (1-5)", function () {
          const json = pm.response.json();
          if (json.length > 0) {
              json.forEach(function(g) {
                  if (g.nivel_gravedad !== undefined) {
                      pm.expect(g.nivel_gravedad).to.be.within(1, 5);
                  }
              });
          }
      });
settings: {}
order: 2000
