$kind: http-request
url: "{{baseUrl}}/api/obtener-empresas-json"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // EAFIT - Caja Negra: Prueba de Listar (GET) - Módulo Transaccional Empresas→Contrataciones
      pm.test("El endpoint responde con éxito (200 OK)", function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      pm.test("El tiempo de respuesta del servidor Flask es menor a 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("Content-Type es application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("application/json");
      });

      pm.test("La respuesta es un array JSON de empresas", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an('array');
      });

      pm.test("Partición Equivalente: cada empresa tiene RIF y nombre (clase válida)", function () {
          const json = pm.response.json();
          if (json.length > 0) {
              pm.expect(json[0]).to.have.any.keys('rif', 'nombre_empresa', 'nombre');
          }
      });
    language: text/javascript
order: 7000
