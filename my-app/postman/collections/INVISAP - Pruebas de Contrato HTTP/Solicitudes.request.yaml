$kind: http-request
url: "{{baseUrl}}/api/obtener-solicitudes-json"
method: GET
headers:
  Cookie: "{{session_cookie}}"
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("application/json");
      });

      pm.test("El cuerpo se puede interpretar como JSON", function () {
          pm.response.json();
      });
    language: text/javascript
settings: {}
order: 1000
