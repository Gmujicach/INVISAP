$kind: http-request
url: "{{baseUrl}}/reporte-estadistico/data?tipo_reporte=solicitudes&agrupacion=dia"
method: GET
queryParams:
  tipo_reporte: solicitudes
  agrupacion: dia
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("application/json");
      });

      pm.test("El cuerpo se puede interpretar como JSON", function () {
          pm.response.json();
      });
    language: text/javascript
settings: {}
order: 16000
