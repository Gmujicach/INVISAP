$kind: http-request
description: "Inicio de sesión de prueba. Configura las variables locales login_username, login_password y recaptcha_token; no guardes credenciales en el repositorio."
url: "{{baseUrl}}/login"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nombre
      value: "{{login_username}}"
      disabled: false
    - type: text
      key: pass_user
      value: "{{login_password}}"
      disabled: false
    - type: text
      key: g-recaptcha-response
      value: "{{recaptcha_token}}"
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test("El login responde con HTML", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("text/html");
      });

      const body = pm.response.text();
      const autenticacionCorrecta =
          !body.includes('name="pass_user"') &&
          !body.includes("Credenciales incorrectas") &&
          !body.includes("No se pudo validar");
      const cookie = pm.cookies.get("session");

      pm.test("No se mostró el formulario de login después de autenticar", function () {
          pm.expect(autenticacionCorrecta).to.be.true;
      });

      pm.test("Cookie de sesión disponible para las siguientes solicitudes", function () {
          pm.expect(autenticacionCorrecta && cookie, "Login exitoso requerido").to.be.ok;
      });
      pm.environment.set(
          "session_cookie",
          autenticacionCorrecta && cookie ? `session=${cookie}` : ""
      );
order: 21000
