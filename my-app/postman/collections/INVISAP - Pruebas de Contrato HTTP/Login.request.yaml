$kind: http-request
description: "Generated from cURL: curl -X POST '{{baseUrl}}/login' --form 'nombre=admin' --form 'pass_user=admin123.' --form 'g-recaptcha-response='"
url: "{{baseUrl}}/login"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: nombre
      value: admin
      disabled: false
    - type: text
      key: pass_user
      value: admin123.
      disabled: false
    - type: text
      key: g-recaptcha-response
      value: 6LdbmUktAAAAALzTEslJCQaLp3O0Hl4Kz5okNVgq
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login responde con éxito (200 OK)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("El tiempo de respuesta es menor a 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("El tipo de contenido es HTML", function () {
          pm.response.to.have.header("Content-Type", "text/html; charset=utf-8");
      });

      pm.test("Cookie de sesión capturada en environment", function () {
          const cookie = pm.cookies.get("session"); // Assuming the cookie name is 'session'
          pm.expect(cookie).to.not.be.undefined;
          pm.environment.set("session_cookie", cookie);
      });
order: 21000
