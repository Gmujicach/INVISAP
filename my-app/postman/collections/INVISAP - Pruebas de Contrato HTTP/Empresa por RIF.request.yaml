$kind: http-request
url: "{{baseUrl}}/api/empresas/{{rif_empresa}}"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // EAFIT - Caja Negra: Partición Equivalente + Valor Límite - Módulo Empresas
      // Clase válida: RIF existente (J-295412360) → 200 con datos de empresa
      // Clase inválida: RIF inexistente → 404 o JSON con error
      pm.test("El endpoint responde con 200 OK o 404 Not Found", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      pm.test("El tiempo de respuesta del servidor Flask es menor a 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });

      pm.test("La respuesta contiene estructura JSON válida", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an('object').or.to.be.an('array');
      });

      if (pm.response.code === 200) {
          pm.test("Clase válida: la empresa tiene RIF y nombre", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.any.keys('rif', 'nombre_empresa', 'nombre');
          });
      }
settings: {}
order: 7000
