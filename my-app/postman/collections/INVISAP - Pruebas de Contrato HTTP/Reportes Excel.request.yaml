$kind: http-request
url: "{{baseUrl}}/reportes/reporte-excel"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "")
              .to.include("text/html");
      });

      pm.test("El cuerpo contiene HTML", function () {
          pm.expect(pm.response.text()).to.include("<");
      });
    language: text/javascript
settings: {}
order: 15000
