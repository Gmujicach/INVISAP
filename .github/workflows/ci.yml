name: CI Pipeline

on:
  push:
    branches: [ master, ci-setup ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Bandit
      run: pip install bandit
    - name: Run Bandit
      run: bandit -r my-app/controllers my-app/models my-app/app.py -f json -o my-app/tests/security/bandit_report.json || true

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run tests
      run: |
        echo "Ejecutando pruebas..."
        pytest || echo "No hay pruebas definidas, continuando..."
